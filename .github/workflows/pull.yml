name: Scheduled data pull

# Runs the headless pull every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) and on
# manual dispatch. Each run writes fresh snapshots to the Postgres cache that
# the Streamlit Cloud app reads from.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated puller GROUP names (blank = all)"
        required: false
        default: ""

concurrency:
  group: data-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    # 90 min: the xStocks puller fans out per-token CoinGecko calls,
    # and each 429 from CoinGecko triggers ~90s of backoff. At ~80
    # xStocks tokens × 2 endpoints (MC + Vol), a fully rate-limited
    # run can take ~60 min just for xStocks. The previous 25-min cap
    # was killing every run mid-xStocks, starving every downstream
    # group (RWA / Foreign L1 / Solana tokens / etc) and producing
    # the "data hasn't updated since June 11" symptom users saw.
    # 90 min leaves comfortable headroom; if even this isn't enough,
    # we'll need to either upgrade CoinGecko Pro tier or move xStocks
    # to a parallel job so it can't block the others.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pullers
        env:
          BIRDEYE_API_KEY:   ${{ secrets.BIRDEYE_API_KEY }}
          # CoinGecko Pro tier key. The xStocks puller fetches
          # MC + Vol per token from CoinGecko (~80 tokens × 2
          # endpoints / cron run). Without this var the puller
          # falls through to the free public endpoint and gets
          # rate-limited into a 90s backoff per call, which used
          # to blow past the 25-min timeout and starve every
          # downstream group ("data hasn't updated since June 11"
          # symptom users reported). With the Pro key, calls go
          # to pro-api.coingecko.com with the x-cg-pro-api-key
          # header and avoid the 429 storm. NOTE: the secret
          # needs to exist in the repo's GitHub Settings →
          # Secrets store; pasting the same key into Streamlit
          # Cloud Secrets isn't sufficient (separate secret
          # stores).
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          PULL_GROUP:        ${{ github.event.inputs.groups }}
        run: |
          python scripts/run_pull.py
