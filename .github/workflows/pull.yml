name: Scheduled data pull

# Runs the headless pull every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) and on
# manual dispatch. Each run writes fresh snapshots to the Postgres cache that
# the Streamlit Cloud app reads from.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "Comma-separated puller GROUP names (blank = all)"
        required: false
        default: ""

concurrency:
  group: data-pull
  cancel-in-progress: false

# `contents: write` is required so the "Commit CoinGecko seeds" step
# below can `git push` the refreshed seed snapshots back to main. The
# default GITHUB_TOKEN at the job level is read-only otherwise.
permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    # 90 min: the xStocks puller fans out per-token CoinGecko calls,
    # and each 429 from CoinGecko triggers ~90s of backoff. At ~80
    # xStocks tokens × 2 endpoints (MC + Vol), a fully rate-limited
    # run can take ~60 min just for xStocks. The previous 25-min cap
    # was killing every run mid-xStocks, starving every downstream
    # group (RWA / Foreign L1 / Solana tokens / etc) and producing
    # the "data hasn't updated since June 11" symptom users saw.
    # 90 min leaves comfortable headroom; if even this isn't enough,
    # we'll need to either upgrade CoinGecko Pro tier or move xStocks
    # to a parallel job so it can't block the others.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pullers
        env:
          BIRDEYE_API_KEY:   ${{ secrets.BIRDEYE_API_KEY }}
          # CoinGecko Pro tier key. The xStocks puller fetches
          # MC + Vol per token from CoinGecko (~80 tokens × 2
          # endpoints / cron run). Without this var the puller
          # falls through to the free public endpoint and gets
          # rate-limited into a 90s backoff per call, which used
          # to blow past the 25-min timeout and starve every
          # downstream group ("data hasn't updated since June 11"
          # symptom users reported). With the Pro key, calls go
          # to pro-api.coingecko.com with the x-cg-pro-api-key
          # header and avoid the 429 storm. NOTE: the secret
          # needs to exist in the repo's GitHub Settings →
          # Secrets store; pasting the same key into Streamlit
          # Cloud Secrets isn't sufficient (separate secret
          # stores).
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          PULL_GROUP:        ${{ github.event.inputs.groups }}
        run: |
          python scripts/run_pull.py

      - name: Commit CoinGecko seeds
        # The xStocks puller writes per-token JSON snapshots into
        # `coingecko_seeds/` on every successful CG call (see
        # `_cg_seed_write` in stocks_dashboard.py). Without this
        # auto-commit step the seeds would only live on this
        # runner's ephemeral disk and be thrown away when the
        # job ends — meaning the Streamlit Cloud container would
        # never see them and the render-path fallback (when CG
        # 429s or the cached Postgres rows go stale) wouldn't
        # have anything to fall back to.
        #
        # We pull --rebase before pushing so the weekly
        # `hyperliquid_categories.yml` workflow's commits (which
        # land on the same branch, different concurrency group)
        # don't cause this push to be rejected. The --quiet on
        # `git diff --cached --quiet` short-circuits when there
        # are no new seed days (e.g. the puller failed entirely),
        # so we don't waste a commit on a no-op.
        #
        # Author identity is the default GitHub Actions bot — same
        # as the Hyperliquid workflow, so the two automation
        # commits look uniform in git log.
        if: always()   # commit even if a later step in the future
                       # fails — partial seed progress is still
                       # worth keeping.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coingecko_seeds/
          if git diff --cached --quiet; then
            echo "no seed changes — nothing to commit"
          else
            git commit -m "chore: refresh CoinGecko seeds"
            # Rebase onto any commits that landed while the
            # 90-min pull was running (rare but possible with the
            # weekly Hyperliquid workflow). Retries once if the
            # push race re-happens during the rebase window.
            git pull --rebase origin main || true
            git push || (git pull --rebase origin main && git push)
          fi
